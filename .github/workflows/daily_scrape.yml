name: Daily Shinjikai DB Update

on:
  schedule:
    # This cron expression runs the script every day at 00:00 UTC (Midnight)
    - cron: "0 0 * * *"
  workflow_dispatch: # This allows you to click a button to run it manually

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the bot to push code back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 tqdm

      - name: Run Scraper
        run: python Shinjikai.py

      - name: Commit and Push New Data
        run: |
          # Set up the GitHub Actions bot user
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new JSONL files and the image folders
          git add data/ yomitan_images/ raw_shinjikai_data.jsonl || true
          
          # Check if there are actual changes before trying to commit
          if git diff --staged --quiet; then
            echo "No new entries found today. Nothing to commit."
          else
            git commit -m "chore: automated daily Shinjikai DB update"
            git push
          fi
