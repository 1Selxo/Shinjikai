name: Daily Shinjikai DB Update

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at midnight UTC
  workflow_dispatch: # Gives you a manual "Run" button on GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save files back to your repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 tqdm

      - name: Run Scraper
        run: python Shinjikai.py

      - name: Commit and Push New Data
        run: |
          # Identity for the GitHub Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the new chunked data folder and images
          git add shinjikai_data/ yomitan_images/ || true
          
          # If the bot found new daily words, commit and save them!
          if git diff --staged --quiet; then
            echo "No new entries found today. Nothing to commit."
          else
            git commit -m "Automated daily Shinjikai DB update"
            git push
          fi
